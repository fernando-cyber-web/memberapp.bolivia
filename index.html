<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="MemberApp Bolivia">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MemberApp">
    <title>MemberApp Bolivia</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { green: '#10b981', blue: '#3b82f6', dark: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .qr-container { aspect-ratio: 1/1; max-width: 280px; margin: 0 auto; }
        .qr-container img { width: 100%; height: 100%; object-fit: contain; }
        .admin-scroll { overflow-y: auto; max-height: calc(100vh - 180px); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';
        import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc, updateDoc, addDoc, query, where, deleteDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';
        window.dbMods = { initializeApp, getFirestore, collection, onSnapshot, doc, setDoc, getDoc, updateDoc, addDoc, query, where, deleteDoc, getDocs };
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { initializeApp, getFirestore, collection, onSnapshot, doc, setDoc, getDoc, updateDoc, addDoc, query, where, deleteDoc, getDocs } = window.dbMods;

        const firebaseConfig = {
            apiKey: "AIzaSyB3G7JaI8TKBxsDL4034e0kcZ0r2Znlvwo",
            authDomain: "memberapp-bolivia.firebaseapp.com",
            projectId: "memberapp-bolivia",
            storageBucket: "memberapp-bolivia.firebasestorage.app",
            messagingSenderId: "1052841262512",
            appId: "1:1052841262512:web:b0f2d71e0e61365fd32a75"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function hashSHA256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function getDeviceId() {
            const storage = window['local' + 'Storage'];
            let deviceId = storage.getItem('memberapp_device_id');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substr(2, 9) + Date.now();
                storage.setItem('memberapp_device_id', deviceId);
            }
            return deviceId;
        }

        function validateHTMLCode(code) {
            if(code.length > 100000) return { valid: false, error: "El código excede los 100KB permitidos." };
            const forbidden = ['eval(', 'document.cookie', 'window.parent'];
            for(let word of forbidden) {
                if(code.includes(word)) return { valid: false, error: `Uso de código prohibido detectado: ${word}` };
            }
            return { valid: true };
        }

        const api = {
            async createGlobalSettingsIfNotExist() {
                const snap = await getDoc(doc(db, "settings", "global"));
                if (!snap.exists()) {
                    const defaultHash = await hashSHA256("admin123");
                    await setDoc(doc(db, "settings", "global"), {
                        adminPasswordHash: defaultHash,
                        monthlyPrice: 150,
                        qrBase64: "",
                        announcement: "¡Bienvenidos a MemberApp Bolivia V1.0!",
                        adminWhatsApp: "59177066695"
                    });
                }
            },
            async registerNewUser(data) {
                const userId = 'usr_' + Date.now();
                const newUser = { 
                    ...data, 
                    id: userId, 
                    status: 'Pendiente', 
                    pin: '', 
                    deviceId: getDeviceId(), 
                    createdAt: new Date().toISOString(), 
                    expiresAt: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString() 
                };
                await setDoc(doc(db, "users", userId), newUser);
                return newUser;
            }
        };

        const Icons = {
            Shield: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
            Home: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            CreditCard: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>,
            User: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            LogOut: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Activity: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            CheckCircle: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            AlertCircle: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Smartphone: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>,
            Users: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Code: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>,
            Upload: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            XCircle: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>,
            Trash2: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Settings: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            Door: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/><path d="M14 12v.01"/></svg>,
            Download: ({ className = '' }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        };

        const SplashScreen = () => (
            <div className="fixed inset-0 bg-gradient-to-br from-brand-green to-brand-blue flex flex-col items-center justify-center z-50 text-white">
                <div className="animate-bounce mb-4"><Icons.Shield className="w-20 h-20" /></div>
                <h1 className="text-4xl font-bold tracking-tight mb-2">MemberApp</h1>
                <p className="text-lg opacity-90">Ecosistema Digital Bolivia</p>
            </div>
        );

        const Onboarding = ({ onComplete }) => {
            const [step, setStep] = useState(1);
            const steps = [
                { icon: <Icons.Activity className="w-12 h-12 text-brand-green" />, title: "Tus Herramientas", text: "Accede a mini-apps diseñadas para hacer crecer tus ventas." },
                { icon: <Icons.CreditCard className="w-12 h-12 text-brand-blue" />, title: "Suscripción Simple", text: "Controla tu membresía mensual de forma transparente." },
                { icon: <Icons.Smartphone className="w-12 h-12 text-brand-dark" />, title: "Siempre Contigo", text: "Úsalo en tu celular o computadora sin instalar nada." }
            ];
            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                    <div className="bg-white dark:bg-gray-800 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
                        <div className="flex justify-center mb-6">{steps[step-1].icon}</div>
                        <h2 className="text-2xl font-bold text-gray-800 dark:text-white mb-3">{steps[step-1].title}</h2>
                        <p className="text-gray-600 dark:text-gray-300 mb-8 h-16">{steps[step-1].text}</p>
                        <button onClick={() => step < 3 ? setStep(step + 1) : onComplete()} className="bg-brand-green text-white px-6 py-2 rounded-full font-semibold shadow-lg hover:bg-emerald-600 transition-colors">
                            {step < 3 ? 'Siguiente' : 'Comenzar'}
                        </button>
                    </div>
                </div>
            );
        };

        const PendingScreen = ({ user, globalSettings, onLogout }) => {
            const adminWpp = globalSettings?.adminWhatsApp || '59177066695';
            const wppMessage = encodeURIComponent(`👋 Hola Admin MemberApp Bolivia,\n\nAcabo de registrarme. Mis datos:\n- Nombre: ${user.nombre}\n- Negocio: ${user.negocio}\n- Rubro: ${user.rubro}\n- WhatsApp: ${user.whatsapp}\n\nAdjunto mi comprobante de pago para activar mi cuenta.`);

            return (
                <div className="min-h-screen bg-gray-50 dark:bg-gray-900 pb-24">
                    <div className="bg-gradient-to-r from-brand-green to-brand-blue p-6 rounded-b-[2rem] shadow-lg text-white pt-8">
                        <div className="flex justify-between items-center mb-4">
                            <div><h1 className="text-2xl font-bold">Hola, {user.nombre.split(' ')[0]}</h1><p className="text-sm opacity-90">{user.negocio}</p></div>
                            <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-sm"><Icons.Shield className="w-6 h-6" /></div>
                        </div>
                    </div>
                    <div className="p-6">
                        <div className="bg-yellow-50 border-2 border-yellow-300 p-6 rounded-3xl shadow-lg text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <h2 className="text-2xl font-bold text-yellow-800 mb-2">Cuenta Pendiente</h2>
                            <p className="text-yellow-700 mb-6">Tu registro fue exitoso, pero tu cuenta aún no está activada.</p>
                            
                            <div className="bg-white p-4 rounded-xl mb-6 text-left">
                                <h3 className="font-bold text-gray-800 mb-2">📋 Instrucciones:</h3>
                                <ol className="text-sm text-gray-700 space-y-2">
                                    <li>1️⃣ Escanea el QR o realiza el pago de Bs. {globalSettings?.monthlyPrice || 150}</li>
                                    <li>2️⃣ Toma una captura del comprobante</li>
                                    <li>3️⃣ Envíalo por WhatsApp haciendo clic en el botón de abajo</li>
                                    <li>4️⃣ El admin activará tu cuenta y te enviará tu PIN de acceso</li>
                                </ol>
                            </div>

                            {globalSettings?.qrBase64 && (
                                <div className="mb-6">
                                    <p className="text-sm font-bold text-gray-700 mb-3">QR de Pago:</p>
                                    <div className="qr-container"><img src={globalSettings.qrBase64} alt="QR" className="rounded-2xl shadow-md border-4 border-white" /></div>
                                </div>
                            )}

                            <a href={`https://wa.me/${adminWpp}?text=${wppMessage}`} target="_blank" rel="noopener noreferrer" className="w-full flex items-center justify-center bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-600 transition-all mb-4">
                                <Icons.Smartphone className="w-5 h-5 mr-2" /> Enviar Comprobante por WhatsApp
                            </a>

                            <button onClick={onLogout} className="w-full bg-gray-200 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-300 transition-colors">
                                Cerrar Sesión
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AuthScreen = ({ onLogin, onRegister, onSecretClick, onRegisterSuccess }) => {
            const [mode, setMode] = useState('login');
            const [pin, setPin] = useState('');
            const [formData, setFormData] = useState({ nombre: '', negocio: '', rubro: '', whatsapp: '' });
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [lockoutTimer, setLockoutTimer] = useState(0);

            useEffect(() => {
                const storage = window['local' + 'Storage'];
                const checkLockout = () => {
                    const failData = JSON.parse(storage.getItem('loginFails') || '{"fails":0, "lockUntil":0}');
                    if (Date.now() < failData.lockUntil) setLockoutTimer(Math.ceil((failData.lockUntil - Date.now()) / 1000));
                    else {
                        if (failData.fails >= 5) storage.setItem('loginFails', JSON.stringify({ fails: 0, lockUntil: 0 }));
                        setLockoutTimer(0);
                    }
                };
                checkLockout();
                const timer = setInterval(checkLockout, 1000);
                return () => clearInterval(timer);
            }, []);

            const recordFail = () => {
                const storage = window['local' + 'Storage'];
                let failData = JSON.parse(storage.getItem('loginFails') || '{"fails":0, "lockUntil":0}');
                failData.fails += 1;
                if (failData.fails >= 5) {
                    failData.lockUntil = Date.now() + 15 * 60 * 1000;
                    setError('Demasiados intentos. Bloqueado por 15 min.');
                }
                storage.setItem('loginFails', JSON.stringify(failData));
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (lockoutTimer > 0) return;
                setLoading(true); setError('');
                try {
                    const q = query(collection(db, "users"), where("pin", "==", pin));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        const foundUser = { id: snap.docs[0].id, ...snap.docs[0].data() };
                        if (foundUser.deviceId !== getDeviceId()) { setError('Dispositivo no autorizado.'); recordFail(); }
                        else if (foundUser.status === 'Pendiente') { onRegisterSuccess(foundUser); }
                        else {
                            window['local' + 'Storage'].setItem('loginFails', JSON.stringify({ fails: 0, lockUntil: 0 }));
                            onLogin(foundUser);
                        }
                    } else { setError('PIN incorrecto.'); recordFail(); }
                } catch (err) { setError('Error de conexión.'); }
                setLoading(false);
            };

            const handleRegister = async (e) => {
                e.preventDefault(); setLoading(true);
                try { 
                    const newUser = await onRegister(formData); 
                    setMode('login'); 
                    setError(''); 
                    onRegisterSuccess(newUser);
                } catch(err) { setError('Error al registrar.'); }
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gray-50 dark:bg-gray-900">
                    <div className="max-w-md w-full bg-white dark:bg-gray-800 rounded-3xl shadow-xl p-8 border border-gray-100 dark:border-gray-700">
                        <div className="text-center mb-8">
                            <div onClick={onSecretClick} className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-green/10 text-brand-green mb-4 cursor-pointer hover:bg-brand-green/20 transition-colors">
                                <Icons.Shield className="w-8 h-8" />
                            </div>
                            <h2 className="text-3xl font-bold text-gray-800 dark:text-white">MemberApp</h2>
                        </div>
                        {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-6 text-sm flex items-center font-semibold"><Icons.AlertCircle className="w-4 h-4 mr-2 shrink-0" /> {error}</div>}
                        {mode === 'login' ? (
                            <form onSubmit={handleLogin} className="space-y-6">
                                <input type="password" maxLength="5" pattern="[0-9]{5}" required disabled={lockoutTimer > 0} value={pin} onChange={(e) => setPin(e.target.value.replace(/[^0-9]/g, ''))} className="w-full text-center text-4xl tracking-[0.4em] p-4 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-brand-green outline-none font-mono" placeholder="•••••"/>
                                {lockoutTimer > 0 ? <div className="text-center bg-red-100 text-red-700 p-3 rounded-xl font-bold">Bloqueado: {Math.floor(lockoutTimer/60)}:{(lockoutTimer%60).toString().padStart(2,'0')} min.</div> : 
                                <button type="submit" disabled={loading || pin.length !== 5} className="w-full bg-gradient-to-r from-brand-green to-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all disabled:opacity-50">{loading ? 'Verificando...' : 'Ingresar'}</button>}
                                <div className="text-center pt-2"><button type="button" onClick={() => setMode('register')} className="text-brand-blue text-sm font-semibold hover:underline">¿No tienes cuenta? Regístrate aquí</button></div>
                            </form>
                        ) : (
                            <form onSubmit={handleRegister} className="space-y-4">
                                <input type="text" placeholder="Tu Nombre Completo" required value={formData.nombre} onChange={e => setFormData({...formData, nombre: e.target.value})} className="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white outline-none" />
                                <input type="text" placeholder="Nombre de tu Negocio" required value={formData.negocio} onChange={e => setFormData({...formData, negocio: e.target.value})} className="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white outline-none" />
                                <input type="text" placeholder="Rubro" required value={formData.rubro} onChange={e => setFormData({...formData, rubro: e.target.value})} className="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white outline-none" />
                                <input type="tel" placeholder="WhatsApp" required value={formData.whatsapp} onChange={e => setFormData({...formData, whatsapp: e.target.value.replace(/[^0-9]/g, '')})} className="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white outline-none" />
                                <button type="submit" disabled={loading} className="w-full bg-brand-blue text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-600 transition-all mt-4">{loading ? 'Registrando...' : 'Solicitar Acceso'}</button>
                                <div className="text-center mt-2"><button type="button" onClick={() => setMode('login')} className="text-gray-500 text-sm font-semibold hover:underline">Volver al Login</button></div>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const ClientDashboard = ({ user, globalSettings, appsList, onLogout }) => {
            const [activeTab, setActiveTab] = useState('apps');
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, mins: 0, secs: 0 });
            const [activeApp, setActiveApp] = useState(null);
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [showInstallBtn, setShowInstallBtn] = useState(false);

            useEffect(() => {
                if (!user.expiresAt) return;
                const calculateTime = () => {
                    const difference = new Date(user.expiresAt).getTime() - new Date().getTime();
                    if (difference > 0) setTimeLeft({ days: Math.floor(difference / (1000 * 60 * 60 * 24)), hours: Math.floor((difference / (1000 * 60 * 60)) % 24), mins: Math.floor((difference / 1000 / 60) % 60), secs: Math.floor((difference / 1000) % 60) });
                    else { setTimeLeft({ days: 0, hours: 0, mins: 0, secs: 0 }); }
                };
                calculateTime();
                const timer = setInterval(calculateTime, 1000);
                return () => clearInterval(timer);
            }, [user.expiresAt]);

            useEffect(() => {
                const handler = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallBtn(true);
                };
                window.addEventListener('beforeinstallprompt', handler);
                return () => window.removeEventListener('beforeinstallprompt', handler);
            }, []);

            const handleInstall = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    setShowInstallBtn(false);
                }
                setDeferredPrompt(null);
            };

            const isActive = user.status === 'Activo' && new Date(user.expiresAt) > new Date();
            const adminWpp = globalSettings?.adminWhatsApp || '59177066695';
            const wppMessage = encodeURIComponent(`👋 Hola Admin MemberApp Bolivia,\n\nSoy: ${user.nombre}\nNegocio: ${user.negocio}\nRubro: ${user.rubro}\nMi PIN: ${user.pin || 'Sin PIN asignado'}\n\nQuiero renovar mi suscripción mensual.\nAdjunto mi comprobante de pago.`);

            if (activeApp) {
                return (
                    <div className="fixed inset-0 bg-white dark:bg-gray-900 z-50 flex flex-col">

                            <button onClick={() => setActiveApp(null)} className="bg-white/20 p-2 rounded-full hover:bg-white/30"><Icons.XCircle className="w-5 h-5" /></button>
                        </div>
                        <iframe srcDoc={activeApp.code} className="w-full flex-1 border-0" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" />
                    </div>

            return (
                <div className="min-h-screen bg-gray-50 dark:bg-gray-900 pb-24">

                            <div><h1 className="text-2xl font-bold">Hola, {user.nombre.split(' ')[0]}</h1><p className="text-sm opacity-90">{user.negocio}</p></div>
                            <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-sm"><Icons.Shield className="w-6 h-6" /></div>
                        </div>
                        {globalSettings?.announcement && <div className="bg-white/20 backdrop-blur p-3 rounded-xl border border-white/30 text-sm flex items-center shadow-inner"><Icons.Activity className="w-5 h-5 mr-2 shrink-0 text-white" /><span className="font-medium">{globalSettings.announcement}</span></div>}
                    </div>
                    <div className="p-6">
                        {showInstallBtn && (
                            <button onClick={handleInstall} className="w-full bg-brand-blue text-white font-bold py-3 rounded-xl shadow-lg hover:bg-blue-600 transition-all mb-4 flex items-center justify-center">
                                <Icons.Download className="w-5 h-5 mr-2" /> Instalar App en tu dispositivo
                            </button>
                        )}
                        {activeTab === 'apps' && (
                            <div className="fade-in">
                                <h2 className="text-xl font-bold text-gray-800 dark:text-white mb-4">Tus Herramientas</h2>
                                {!isActive && <div className="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl mb-4 text-center font-semibold">⚠️ Suscripción vencida. Renueva para acceder a las herramientas.</div>}
                                <div className="grid grid-cols-2 gap-4">
                                    {isActive && appsList.map(app => (
                                        <div key={app.id} onClick={() => setActiveApp(app)} className="bg-white dark:bg-gray-800 p-4 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center justify-center text-center cursor-pointer hover:shadow-md transition-all">
                                            <div className="w-16 h-16 bg-brand-green/10 text-brand-green rounded-2xl flex items-center justify-center mb-3"><Icons.Activity className="w-8 h-8" /></div>
                                            <span className="font-bold text-gray-800 dark:text-white text-sm">{app.name}</span>
                                        </div>
                                    ))}
                                    {appsList.length === 0 && isActive && <div className="col-span-2 text-center py-12 bg-gray-100 dark:bg-gray-800 rounded-3xl text-gray-500 border border-dashed border-gray-300">Pronto agregaremos nuevas herramientas.</div>}
                                </div>
                            </div>
                        )}
                        {activeTab === 'pago' && (
                            <div className="space-y-6 fade-in">
                                <div className={`p-6 rounded-3xl shadow-lg border text-center ${isActive ? 'bg-white dark:bg-gray-800 border-gray-100' : 'bg-red-50 border-red-200 dark:bg-red-900/20'}`}>
                                    <h2 className="text-xl font-bold text-gray-800 dark:text-white mb-2">Estado de Suscripción</h2>
                                    <div className="flex justify-center space-x-3 my-6">
                                        <div className="bg-gray-100 dark:bg-gray-700 p-3 rounded-2xl w-20 shadow-inner"><div className="text-2xl font-bold text-brand-blue">{timeLeft.days}</div><div className="text-xs text-gray-500 uppercase font-bold">Días</div></div>
                                        <div className="bg-gray-100 dark:bg-gray-700 p-3 rounded-2xl w-20 shadow-inner"><div className="text-2xl font-bold text-brand-blue">{timeLeft.hours}</div><div className="text-xs text-gray-500 uppercase font-bold">Hrs</div></div>
                                        <div className="bg-gray-100 dark:bg-gray-700 p-3 rounded-2xl w-20 shadow-inner"><div className="text-2xl font-bold text-brand-blue">{timeLeft.mins}</div><div className="text-xs text-gray-500 uppercase font-bold">Min</div></div>
                                    </div>
                                    {!isActive && <p className="text-red-500 font-bold mb-6 bg-red-100 p-3 rounded-xl">Suscripción Vencida. Renueva para continuar.</p>}
                                    <div className="bg-gray-100 dark:bg-gray-700 p-5 rounded-2xl mb-6"><p className="text-sm text-gray-600 dark:text-gray-300 mb-1 font-semibold">Costo Mensual</p><p className="text-4xl font-black text-brand-green">Bs. {globalSettings?.monthlyPrice || 150}</p></div>
                                    {globalSettings?.qrBase64 && <div className="mb-6"><p className="text-sm font-bold text-gray-700 dark:text-gray-300 mb-3">1. Escanea para pagar:</p><div className="qr-container"><img src={globalSettings.qrBase64} alt="QR" className="rounded-2xl shadow-md border-4 border-white" /></div></div>}
                                    <p className="text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">2. Envía tu comprobante:</p>
                                    <a href={`https://wa.me/${adminWpp}?text=${wppMessage}`} target="_blank" rel="noopener noreferrer" className="w-full flex items-center justify-center bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-600 transition-all"><Icons.Smartphone className="w-5 h-5 mr-2" /> Enviar por WhatsApp</a>
                                </div>
                            </div>
                        )}
                        {activeTab === 'perfil' && (
                            <div className="space-y-4 fade-in">

                                        <div className="flex justify-between items-center border-b border-gray-100 dark:border-gray-700 pb-2"><span className="font-semibold text-sm">Negocio:</span><span className="text-gray-800 dark:text-white font-bold">{user.negocio}</span></div>
                                        <div className="flex justify-between items-center border-b border-gray-100 dark:border-gray-700 pb-2"><span className="font-semibold text-sm">Rubro:</span><span className="text-gray-800 dark:text-white font-bold">{user.rubro}</span></div>
                                        <div className="flex justify-between items-center border-b border-gray-100 dark:border-gray-700 pb-2"><span className="font-semibold text-sm">Tu PIN:</span><span className="bg-gray-100 dark:bg-gray-700 px-3 py-1 rounded-lg font-mono font-bold tracking-widest">{user.pin || 'Pendiente'}</span></div>
                                        <div className="flex justify-between items-center pb-2"><span className="font-semibold text-sm">Estado:</span><span className={`font-black flex items-center ${isActive ? 'text-brand-green' : 'text-red-500'}`}>{isActive ? <Icons.CheckCircle className="w-4 h-4 mr-1"/> : <Icons.AlertCircle className="w-4 h-4 mr-1"/>}{user.status}</span></div>
                                    </div>
                                </div>
                                <button onClick={onLogout} className="w-full bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 font-bold py-4 rounded-xl flex items-center justify-center hover:bg-red-100 transition-colors"><Icons.LogOut className="w-5 h-5 mr-2" /> Cerrar Sesión</button>
                            </div>
                        )}
                    </div>
                    <div className="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-700 flex justify-around p-2 pb-safe z-40">
                        <button onClick={() => setActiveTab('apps')} className={`flex flex-col items-center p-3 rounded-xl transition-all ${activeTab === 'apps' ? 'text-brand-green bg-brand-green/10' : 'text-gray-400'}`}><Icons.Home className="w-6 h-6" /><span className="text-[10px] mt-1 font-bold">APPS</span></button>
                        <button onClick={() => setActiveTab('pago')} className={`flex flex-col items-center p-3 rounded-xl transition-all ${activeTab === 'pago' ? 'text-brand-blue bg-brand-blue/10' : 'text-gray-400'}`}><Icons.CreditCard className="w-6 h-6" /><span className="text-[10px] mt-1 font-bold">PAGO</span></button>
                        <button onClick={() => setActiveTab('perfil')} className={`flex flex-col items-center p-3 rounded-xl transition-all ${activeTab === 'perfil' ? 'text-gray-800 dark:text-white bg-gray-100 dark:bg-gray-800' : 'text-gray-400'}`}><Icons.User className="w-6 h-6" /><span className="text-[10px] mt-1 font-bold">PERFIL</span></button>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ onExit }) => {
            const [activeTab, setActiveTab] = useState('clientes');
            const [usersList, setUsersList] = useState([]);
            const [appsList, setAppsList] = useState([]);
            const [settings, setSettings] = useState({ monthlyPrice: 150, qrBase64: '', announcement: '', adminWhatsApp: '59177066695' });
            const [newApp, setNewApp] = useState({ name: '', code: '' });
            const [adminPassword, setAdminPassword] = useState('');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubUsers = onSnapshot(collection(db, "users"), (snap) => setUsersList(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubApps = onSnapshot(collection(db, "apps"), (snap) => setAppsList(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubSettings = onSnapshot(doc(db, "settings", "global"), (docSnap) => {
                    if(docSnap.exists()) setSettings({...{ monthlyPrice: 150, qrBase64: '', announcement: '', adminWhatsApp: '59177066695' }, ...docSnap.data()});
                    setLoading(false);
                });
                return () => { unsubUsers(); unsubApps(); unsubSettings(); };
            }, []);

            const generateUniquePin = async (userId) => {
                let unique = false, newPin = '';
                while (!unique) {
                    newPin = Math.floor(10000 + Math.random() * 90000).toString();
                    const snap = await getDocs(query(collection(db, "users"), where("pin", "==", newPin)));
                    if (snap.empty) unique = true;
                }
                await updateDoc(doc(db, "users", userId), { pin: newPin, status: 'Activo' });
                alert(`PIN generado con éxito: ${newPin}`);
            };

            const addDays = async (userId, days) => {
                const newDate = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toISOString();
                await updateDoc(doc(db, "users", userId), { expiresAt: newDate, status: 'Activo' });
            };

            const handleQRUpload = (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setSettings({...settings, qrBase64: reader.result});
                    reader.readAsDataURL(file);
                }
            };

            const saveSettings = async () => {
                await updateDoc(doc(db, "settings", "global"), { monthlyPrice: settings.monthlyPrice, qrBase64: settings.qrBase64, announcement: settings.announcement, adminWhatsApp: settings.adminWhatsApp });
                alert('Configuración guardada.');
            };

            const changeAdminPassword = async () => {
                if(adminPassword.length < 6) return alert("Mínimo 6 caracteres");
                await updateDoc(doc(db, "settings", "global"), { adminPasswordHash: await hashSHA256(adminPassword) });
                setAdminPassword(''); alert('Contraseña maestra actualizada.');
            };

            const injectApp = async () => {
                if(!newApp.name || !newApp.code) return alert("Completa nombre y código");
                const validation = validateHTMLCode(newApp.code);
                if(!validation.valid) return alert(validation.error);
                await addDoc(collection(db, "apps"), { name: newApp.name, code: newApp.code, createdAt: new Date().toISOString() });
                setNewApp({name: '', code: ''}); alert("App inyectada y publicada.");
            };

            const deleteApp = async (appId) => {
                if(window.confirm('¿Eliminar esta App para todos los clientes?')) await deleteDoc(doc(db, "apps", appId));
            };

            if(loading) return <div className="min-h-screen flex items-center justify-center bg-gray-900 text-white">Cargando Panel...</div>;

            return (
                <div className="min-h-screen bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100">
                    <div className="bg-brand-dark text-white p-4 shadow-lg sticky top-0 z-40 flex justify-between items-center">
                        <div className="flex items-center space-x-2"><Icons.Shield className="w-6 h-6 text-brand-green" /><h1 className="text-xl font-bold">Centro de Mando V1.0</h1></div>
                        <button onClick={onExit} className="bg-red-500/20 text-red-400 p-2 rounded-lg hover:bg-red-500/40"><Icons.Door className="w-5 h-5" /></button>
                    </div>
                    <div className="flex overflow-x-auto bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 p-2 space-x-2 sticky top-16 z-30">
                        <button onClick={() => setActiveTab('clientes')} className={`flex items-center px-4 py-2 rounded-lg font-semibold whitespace-nowrap ${activeTab === 'clientes' ? 'bg-brand-blue text-white' : 'text-gray-600 dark:text-gray-300'}`}><Icons.Users className="w-5 h-5 mr-2" /> Clientes</button>
                        <button onClick={() => setActiveTab('apps')} className={`flex items-center px-4 py-2 rounded-lg font-semibold whitespace-nowrap ${activeTab === 'apps' ? 'bg-brand-green text-white' : 'text-gray-600 dark:text-gray-300'}`}><Icons.Code className="w-5 h-5 mr-2" /> Inyector Apps</button>
                        <button onClick={() => setActiveTab('sistema')} className={`flex items-center px-4 py-2 rounded-lg font-semibold whitespace-nowrap ${activeTab === 'sistema' ? 'bg-gray-800 dark:bg-gray-600 text-white' : 'text-gray-600 dark:text-gray-300'}`}><Icons.Settings className="w-5 h-5 mr-2" /> Sistema</button>
                    </div>
                    <div className="p-4 md:p-6 pb-24 admin-scroll">
                        {activeTab === 'clientes' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {usersList.map(u => {
                                    const isExpired = new Date(u.expiresAt) < new Date();
                                    return (
                                        <div key={u.id} className="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow border border-gray-100 dark:border-gray-700">
                                            <div className="flex justify-between items-start mb-3">
                                                <div><h3 className="font-bold text-lg">{u.negocio}</h3><p className="text-sm text-gray-500">{u.nombre} - {u.rubro}</p></div>
                                                <span className={`px-2 py-1 text-xs font-bold rounded-full ${u.status === 'Pendiente' ? 'bg-yellow-100 text-yellow-700' : u.status === 'Activo' && !isExpired ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{u.status === 'Activo' && isExpired ? 'Vencido' : u.status}</span>
                                            </div>
                                            <div className="text-sm space-y-1 mb-4 bg-gray-50 dark:bg-gray-700 p-3 rounded-lg">
                                                <p><strong>WhatsApp:</strong> {u.whatsapp}</p>
                                                <p><strong>PIN:</strong> <span className="font-mono bg-gray-200 dark:bg-gray-600 px-1 rounded">{u.pin || 'No generado'}</span></p>
                                                <p><strong>Vence:</strong> {new Date(u.expiresAt).toLocaleDateString()}</p>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 text-sm">
                                                <button onClick={() => generateUniquePin(u.id)} className="bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 py-2 rounded-lg font-semibold">Generar PIN</button>
                                                <button onClick={() => addDays(u.id, 7)} className="bg-green-50 text-green-600 dark:bg-green-900/30 dark:text-green-400 py-2 rounded-lg font-semibold">+ 7 Días</button>
                                                <button onClick={() => addDays(u.id, 30)} className="bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400 py-2 rounded-lg font-semibold">+ 30 Días</button>
                                                <button onClick={() => updateDoc(doc(db, "users", u.id), { status: u.status === 'Activo' ? 'Inactivo' : 'Activo' })} className="bg-orange-50 text-orange-600 dark:bg-orange-900/30 dark:text-orange-400 py-2 rounded-lg font-semibold">{u.status === 'Activo' ? 'Inactivar' : 'Activar'}</button>
                                            </div>
                                        </div>
                                    );
                                })}
                                {usersList.length === 0 && <div className="col-span-full text-center py-12 text-gray-500">Aún no hay clientes registrados.</div>}
                            </div>
                        )}
                        {activeTab === 'apps' && (
                            <div className="space-y-6">
                                <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-brand-green/20">
                                    <h2 className="text-xl font-bold mb-4 flex items-center text-brand-green"><Icons.Upload className="w-5 h-5 mr-2"/> Inyectar Nueva Herramienta</h2>
                                    <input type="text" placeholder="Nombre de la App" value={newApp.name} onChange={e => setNewApp({...newApp, name: e.target.value})} className="w-full mb-3 p-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600 outline-none focus:ring-2 focus:ring-brand-green" />
                                    <textarea placeholder="Pega el código HTML/JS/CSS aquí..." value={newApp.code} onChange={e => setNewApp({...newApp, code: e.target.value})} className="w-full h-48 mb-3 p-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600 font-mono text-sm outline-none focus:ring-2 focus:ring-brand-green"></textarea>
                                    <button onClick={injectApp} className="w-full bg-brand-green text-white font-bold py-3 rounded-xl shadow-lg hover:bg-emerald-600 transition-all">Inyectar y Publicar</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {appsList.map(app => (
                                        <div key={app.id} className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow border border-gray-100 dark:border-gray-700 flex justify-between items-center">
                                            <span className="font-bold">{app.name}</span>
                                            <button onClick={() => deleteApp(app.id)} className="p-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100"><Icons.Trash2 className="w-5 h-5" /></button>

                                    ))}
                                    {appsList.length === 0 && <div className="col-span-full text-center py-8 text-gray-500">Aún no hay apps inyectadas.</div>}
                                </div>
                            </div>
                        )}
                        {activeTab === 'sistema' && (
                            <div className="max-w-xl space-y-6">
                                <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow border border-gray-100 dark:border-gray-700">
                                    <h2 className="text-xl font-bold mb-4">Configuración de Pagos</h2>
                                    <label className="block text-sm font-semibold mb-2">Precio Mensual (Bs.)</label>
                                    <input type="number" value={settings.monthlyPrice} onChange={e => setSettings({...settings, monthlyPrice: Number(e.target.value)})} className="w-full mb-4 p-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600" />
                                    <label className="block text-sm font-semibold mb-2">QR de Cobro (Imagen)</label>
                                    <input type="file" accept="image/*" onChange={handleQRUpload} className="w-full mb-4 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand-green/10 file:text-brand-green" />
                                    {settings.qrBase64 && <div className="qr-container mb-4"><img src={settings.qrBase64} className="rounded-xl shadow-md border-2 border-gray-200" alt="QR" /></div>}
                                    <label className="block text-sm font-semibold mb-2">Anuncio Global</label>
                                    <input type="text" value={settings.announcement || ''} onChange={e => setSettings({...settings, announcement: e.target.value})} className="w-full mb-4 p-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600" />
                                    <button onClick={saveSettings} className="w-full bg-brand-blue text-white font-bold py-3 rounded-xl shadow-lg hover:bg-blue-600 transition-all">Guardar Cambios</button>
                                </div>
                                <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow border border-gray-100 dark:border-gray-700">
                                    <h2 className="text-xl font-bold mb-4 text-brand-green flex items-center"><Icons.Smartphone className="w-5 h-5 mr-2"/> WhatsApp de Cobro</h2>
                                    <p className="text-sm text-gray-600 dark:text-gray-400 mb-3">Número al que los clientes enviarán el comprobante de pago. Incluye el código de país sin el + (ej: 59177066695)</p>
                                    <input type="tel" value={settings.adminWhatsApp || ''} onChange={e => setSettings({...settings, adminWhatsApp: e.target.value.replace(/[^0-9]/g, '')})} placeholder="59177066695" className="w-full mb-4 p-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600 font-mono" />
                                    <button onClick={saveSettings} className="w-full bg-green-500 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-green-600 transition-all">Guardar Número</button>
                                </div>
                                <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow border border-gray-100 dark:border-gray-700">
                                    <h2 className="text-xl font-bold mb-4 text-red-500 flex items-center"><Icons.Shield className="w-5 h-5 mr-2"/> Seguridad</h2>
                                    <input type="password" placeholder="Nueva Contraseña Maestra" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} className="w-full mb-4 p-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600" />
                                    <button onClick={changeAdminPassword} className="w-full bg-gray-800 text-white font-bold py-3 rounded-xl hover:bg-gray-900 transition-all">Actualizar Contraseña</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [loading, setLoading] = useState(true);
            const [currentUser, setCurrentUser] = useState(null);
            const [globalSettings, setGlobalSettings] = useState(null);
            const [appsList, setAppsList] = useState([]);
            const [showOnboarding, setShowOnboarding] = useState(false);
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [adminAuthenticated, setAdminAuthenticated] = useState(false);
            const [pendingUser, setPendingUser] = useState(null);
            const clickCountRef = useRef(0);

            useEffect(() => {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
                }
            }, []);

            useEffect(() => {
                const initApp = async () => {
                    await api.createGlobalSettingsIfNotExist();
                    if (!window['local' + 'Storage'].getItem('memberapp_first_login')) setShowOnboarding(true);
                    const savedUserId = window['local' + 'Storage'].getItem('memberapp_session');
                    if (savedUserId) {
                        try {
                            const userDoc = await getDoc(doc(db, "users", savedUserId));
                            if (userDoc.exists() && userDoc.data().deviceId === getDeviceId()) setCurrentUser({ id: userDoc.id, ...userDoc.data() });
                            else window['local' + 'Storage'].removeItem('memberapp_session');
                        } catch (e) { console.error("Error sesión"); }
                    }
                    setLoading(false);
                };
                initApp();
            }, []);

            useEffect(() => {
                let unsubSettings, unsubApps, unsubUser;
                if (currentUser && !isAdminMode) {
                    unsubSettings = onSnapshot(doc(db, "settings", "global"), (docSnap) => { if(docSnap.exists()) setGlobalSettings(docSnap.data()); });
                    unsubApps = onSnapshot(collection(db, "apps"), (snap) => { setAppsList(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))); });
                    unsubUser = onSnapshot(doc(db, "users", currentUser.id), (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.deviceId !== getDeviceId()) { window['local' + 'Storage'].removeItem('memberapp_session'); setCurrentUser(null); }
                            else setCurrentUser({ id: docSnap.id, ...data });
                        } else { window['local' + 'Storage'].removeItem('memberapp_session'); setCurrentUser(null); }
                    });
                }
                return () => { if(unsubSettings) unsubSettings(); if(unsubApps) unsubApps(); if(unsubUser) unsubUser(); };
            }, [currentUser, isAdminMode]);

            const handleSecretClick = () => {
                clickCountRef.current += 1;
                if (clickCountRef.current >= 5) { setIsAdminMode(true); clickCountRef.current = 0; }
                else setTimeout(() => { clickCountRef.current = 0; }, 2000);
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                const pass = e.target.password.value;
                const snap = await getDoc(doc(db, "settings", "global"));
                if (snap.exists() && snap.data().adminPasswordHash === await hashSHA256(pass)) setAdminAuthenticated(true);
                else alert("Contraseña Maestra Incorrecta");
            };

            const handleLogin = (user) => { window['local' + 'Storage'].setItem('memberapp_session', user.id); setCurrentUser(user); };
            const handleLogout = () => { window['local' + 'Storage'].removeItem('memberapp_session'); setCurrentUser(null); setPendingUser(null); };
            const completeOnboarding = () => { window['local' + 'Storage'].setItem('memberapp_first_login', 'true'); setShowOnboarding(false); };
            const handleRegisterSuccess = (user) => { setPendingUser(user); };

            if (loading) return <SplashScreen />;
            if (showOnboarding) return <Onboarding onComplete={completeOnboarding} />;
            if (pendingUser) return <PendingScreen user={pendingUser} globalSettings={globalSettings} onLogout={handleLogout} />;

            if (isAdminMode) {
                if (!adminAuthenticated) {
                    return (
                        <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
                            <form onSubmit={handleAdminLogin} className="bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full border border-gray-700">
                                <div className="text-center mb-6"><Icons.Shield className="w-12 h-12 text-brand-green mx-auto mb-2" /><h2 className="text-white text-xl font-bold">Acceso Clasificado</h2></div>
                                <input name="password" type="password" placeholder="Contraseña Maestra" className="w-full p-3 rounded-lg bg-gray-700 text-white mb-4 outline-none focus:ring-2 focus:ring-brand-green" autoFocus />
                                <button type="submit" className="w-full bg-brand-green text-white font-bold py-3 rounded-lg">Entrar al Sistema</button>
                                <button type="button" onClick={() => setIsAdminMode(false)} className="w-full text-gray-400 mt-4 text-sm hover:text-white">Volver al sitio público</button>
                            </form>
                        </div>
                    );
                }
                return <AdminDashboard onExit={() => { setIsAdminMode(false); setAdminAuthenticated(false); }} />;
            }

            if (currentUser) return <ClientDashboard user={currentUser} globalSettings={globalSettings} appsList={appsList} onLogout={handleLogout} />;

            return (
                <div className="relative">
                    <div onClick={handleSecretClick} className="absolute top-0 left-0 w-16 h-16 z-50 cursor-default opacity-0"></div>
                    <AuthScreen onLogin={handleLogin} onRegister={api.registerNewUser} onSecretClick={handleSecretClick} onRegisterSuccess={handleRegisterSuccess} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
